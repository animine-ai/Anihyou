name: EP02 Production Runtime Android Proof
on:
  push:
    branches: [feature/aniworld-provider-v3]
    paths:
      - "settings.gradle.kts"
      - "tools/ep02-android/**"
      - "private/release-core/**"
      - "private/release-data/**"
      - ".github/workflows/ep02-runtime-android-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep02-runtime-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    name: EP02 Kotlin host contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run strict release/navigation/package tests
        run: ./gradlew --console=plain :private:release-core:test :private:release-data:testDebugUnitTest
      - name: Prove runtime path has no provider-specific fallback
        run: |
          ! grep -R -n -E 'AniWorld|de\.aniworld'             private/release-data/src/main/kotlin/com/axiel7/anihyou/release/data/extension/ExtensionHostCoordinator.kt             private/release-data/src/main/kotlin/com/axiel7/anihyou/release/data/extension/WasmtimeExtensionRuntime.kt
      - name: Upload host reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep02-runtime-host-contracts
          path: |
            private/release-core/build/reports/tests/
            private/release-data/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  native:
    name: Wasmtime 48.0.3 LTS Android API 24 native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Build production native runtime
        run: bash tools/ep02-android/build-native.sh
      - name: Verify exact production pin
        run: |
          grep -F 'wasmtime v48.0.3' tools/ep02-android/results/native/dependencies.txt
          grep -F 'cranelift-codegen v0.135.3' tools/ep02-android/results/native/dependencies.txt
      - name: Upload production runtime and exact lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep02-native-wasmtime-48.0.3-x86_64
          path: |
            tools/ep02-android/native-out/
            tools/ep02-android/results/native/
          if-no-files-found: error
          retention-days: 14

  android:
    needs: [native, host-contract]
    name: EP02 Kotlin Host API ${{ matrix.api }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {api: 24, variant: debug}
          - {api: 24, variant: release}
          - {api: 35, variant: debug}
          - {api: 35, variant: release}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ep02-native-wasmtime-48.0.3-x86_64
          path: tools/ep02-android/native-artifact
      - name: Build deterministic fixture and Kotlin-host APK
        shell: bash
        run: |
          mkdir -p tools/ep02-android/host-app/src/main/jniLibs/x86_64
          cp tools/ep02-android/native-artifact/libarex_runtime.so tools/ep02-android/host-app/src/main/jniLibs/x86_64/
          bash tools/ep02-android/build-fixture.sh
          git rev-parse HEAD > tools/ep02-android/source-commit.txt
          task=":tools:ep02-runtime-app:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }}"
          ./gradlew --console=plain --stacktrace "$task"
          sha256sum tools/ep02-android/host-app/build/outputs/apk/${{ matrix.variant }}/*.apk > tools/ep02-android/apk.sha256
          if [[ "${{ matrix.variant }}" == release ]]; then
            test -f tools/ep02-android/host-app/build/outputs/mapping/release/mapping.txt
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Kotlin Host -> Production Runtime -> isolated Wasmtime fixture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash tools/ep02-android/run-device.sh ${{ matrix.variant }} ${{ matrix.api }}
      - name: Collect checksums and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}
          cp tools/ep02-android/source-commit.txt tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}/ 2>/dev/null || true
          cp tools/ep02-android/apk.sha256 tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}/ 2>/dev/null || true
          cp tools/ep02-android/native-artifact/Cargo.lock tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}/ 2>/dev/null || true
          timeout 15 adb logcat -d > tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}/cleanup-logcat.txt 2>&1 || true
      - name: Upload EP02 host APK, R8 and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep02-kotlin-host-api-${{ matrix.api }}-${{ matrix.variant }}
          path: |
            tools/ep02-android/host-app/build/outputs/apk/
            tools/ep02-android/host-app/build/outputs/mapping/
            tools/ep02-android/results/android-${{ matrix.api }}-${{ matrix.variant }}/
            tools/ep02-android/host-app/src/main/assets/fixture.wasm.sha256
          if-no-files-found: warn
          retention-days: 14
