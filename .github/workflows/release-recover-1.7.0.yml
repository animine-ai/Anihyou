name: Recover Kiyori 1.7.0 Release
run-name: Verify and publish existing Kiyori 1.7.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/release-recover-1.7.0.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: kiyori-release-1.7.0
  cancel-in-progress: false
jobs:
  publish-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 469c3ded5bdb116c2d550598e44ba42fe11b0038
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Verify original build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38470501712" --jq .head_sha)" == 469c3ded5bdb116c2d550598e44ba42fe11b0038 ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11852305687" --jq .name)" == signed-kiyori-release-469c3ded5bdb116c2d550598e44ba42fe11b0038 ]]
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: signed-kiyori-release-469c3ded5bdb116c2d550598e44ba42fe11b0038
          run-id: 38470501712
          github-token: ${{ github.token }}
          path: out
      - name: Verify original APK bytes and packaged runtime
        run: |
          set -euo pipefail
          echo 'f78daebda0cef8a93c40885f756816247e43d2190d737e877521a4f04c5bc798  out/Kiyori-1.7.0-arm64-v8a.apk' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile,struct
          from pathlib import Path
          report=json.loads(Path("out/native-verification.json").read_text())
          path=Path("out/Kiyori-1.7.0-arm64-v8a.apk")
          with zipfile.ZipFile(path) as z, path.open("rb") as raw:
              names=[n for n in z.namelist() if n.endswith("/libarex_runtime.so")]
              assert names==["lib/arm64-v8a/libarex_runtime.so"],names
              assert all(n.startswith("lib/arm64-v8a/") for n in z.namelist() if n.startswith("lib/"))
              entry=names[0]
              assert hashlib.sha256(z.read(entry)).hexdigest()==report["nativeSha256"]["arm64-v8a/libarex_runtime.so"]
              info=z.getinfo(entry)
              assert info.compress_type==zipfile.ZIP_STORED
              raw.seek(info.header_offset+26)
              filename_size,extra_size=struct.unpack("<HH",raw.read(4))
              assert (info.header_offset+30+filename_size+extra_size)%16384==0
          print("Original signed APK and pinned native runtime verified")
          PY
      - name: Verify release certificate, package and version
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release-key.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs out/Kiyori-1.7.0-arm64-v8a.apk > out/signature-verification.txt
          keytool -exportcert -keystore "$key" -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/release-cert.der"
          expected="$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d ' ' -f 1)"
          actual="$(sed -nE 's/^(Signer .*|V[0-9]+(\.[0-9]+)* Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\3/p' out/signature-verification.txt | tr 'A-F' 'a-f' | sort -u)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Release certificate mismatch"; exit 1; }
          echo "Release certificate matches the uploaded keystore"
          "$tools/zipalign" -c -P 16 4 out/Kiyori-1.7.0-arm64-v8a.apk
          "$tools/aapt" dump badging out/Kiyori-1.7.0-arm64-v8a.apk > out/apk-badging.txt
          head -n 1 out/apk-badging.txt
          grep -q "package: name='app.kiyori' versionCode='136' versionName='1.7.0'" out/apk-badging.txt
          if grep -q "^application-debuggable" out/apk-badging.txt; then exit 1; fi
          (cd out && sha256sum Kiyori-1.7.0-arm64-v8a.apk > SHA256.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-kiyori-release-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified first release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.7.0 out/Kiyori-1.7.0-arm64-v8a.apk out/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target 469c3ded5bdb116c2d550598e44ba42fe11b0038 \
            --title "Kiyori 1.7.0" --notes-file docs/releases/1.7.0.md --latest
