name: AniWorld Provider V3 Evidence Ingestion

on:
  push:
    branches:
      - feature/aniworld-provider-v3
    paths:
      - "private/release-core/**"
      - "private/release-data/**"
      - ".github/workflows/aniworld-provider-v3.yml"

permissions:
  contents: read

concurrency:
  group: aniworld-provider-v3-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-modules-test:
    name: Release core and data unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run release-core and release-data tests
        run: ./gradlew --console=plain --stacktrace :private:release-core:test :private:release-data:test
