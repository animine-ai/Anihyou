
name: AniWorld Provider V3 Evidence Ingestion
# Manual browser trigger checkpoint; no product behavior changes.

on:
  push:
    branches:
      - feature/aniworld-provider-v3
      - ep03/user-added-sources
      - ep04/aniworld-v1
      - ep06/provider-navigation-watch-next
    paths:
      - "private/release-core/**"
      - "private/release-data/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - "baselineprofile/**"
      - "wearos/**"
      - "scripts/**"
      - "docs/aniworld-shadow-canary.md"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - ".github/workflows/aniworld-provider-v3.yml"
      - ".github/scripts/verify-extension-native-packaging.py"
      - "tools/ep02-android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aniworld-provider-v3-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-room-schema-export:
    name: Export Room schema ${{ matrix.schema_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - schema_version: 8
            source_ref: ci/historical-room-v8-source
            historical_source_sha: 4c912fc5542060917f9ea7b1c289b22992d4017d
            imported_source_commit: 6d1000ffda148748c86a1d6e25d07a993684c249
          - schema_version: 9
            source_ref: ci/historical-room-v9-source
            historical_source_sha: fba44c807f750469ee7b0571c418ffe3cacb67dd
            imported_source_commit: 6628284ced4fdd19aa99359d0e579df1ee33d96f
          - schema_version: 10
            source_ref: bf6a8f48deecf88711e2a00acde3ac30a2cab6c4
            historical_source_sha: bf6a8f48deecf88711e2a00acde3ac30a2cab6c4
            imported_source_commit: bf6a8f48deecf88711e2a00acde3ac30a2cab6c4
          - schema_version: 12
            source_ref: 28491cebaafc134da6e60831120207404b022cb0
            historical_source_sha: 28491cebaafc134da6e60831120207404b022cb0
            imported_source_commit: 28491cebaafc134da6e60831120207404b022cb0
    steps:
      - name: Checkout internalized historical schema source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source_ref }}

      - name: Verify internalized historical source ref
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ matrix.imported_source_commit }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected internalized source commit $expected, got $actual"
            exit 1
          fi
          if [[ "${{ matrix.schema_version }}" == "10" ]]; then
            echo "Room 10 source: accepted animine-ai/Anihyou baseline"
          else
            echo "Historical Room source SHA: ${{ matrix.historical_source_sha }}"
          fi
          echo "New-repo source ref: ${{ matrix.source_ref }}"
          echo "New-repo source commit: $actual"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install compile SDK 37
        run: |
          android sdk install --help
          android sdk install platforms/android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Run Room KSP schema export
        run: ./gradlew --console=plain --stacktrace :private:release-data:kspDebugKotlin

      - name: Validate generated schema JSON
        id: schema
        shell: bash
        run: |
          mkdir -p private/release-data/schemas
          schema_path="$(find private/release-data/schemas -type f -name "${{ matrix.schema_version }}.json" -print -quit)"
          if [[ -z "$schema_path" ]]; then
            echo "Room schema ${{ matrix.schema_version }}.json was not generated"
            find private/release-data/schemas -type f -print
            exit 1
          fi
          python3 -m json.tool "$schema_path" >/dev/null
          if [[ "${{ matrix.schema_version }}" == "12" ]]; then
            test "$(sha256sum "$schema_path" | cut -d ' ' -f 1)" = "4a30c43bbfdde940f464286bf4109667e75873a3b31de2c7fff09660936ddf69"
          fi
          echo "schema_path=$schema_path" >> "$GITHUB_OUTPUT"

      - name: Upload real schema ${{ matrix.schema_version }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: room-schema-${{ matrix.schema_version }}
          path: ${{ steps.schema.outputs.schema_path }}
          if-no-files-found: error
          retention-days: 14

  release-modules-test:
    name: Core/Data tests and Room schema 13 export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Diagnose Android CLI and SDK 37 availability
        shell: bash
        run: |
          set +e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          java -version
          android --version
          android --help
          android sdk --help
          android sdk list --help
          android sdk list
          echo "Android CLI diagnostics complete; command exit status above is diagnostic only"

      - name: Install compile SDK 37
        run: |
          android sdk install --help
          android sdk install platforms/android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Verify projects and required task graph
        run: |
          ./gradlew --console=plain projects
          ./gradlew --console=plain :private:release-core:tasks --all
          ./gradlew --console=plain :private:release-data:tasks --all
          ./gradlew --console=plain :feature:worker:tasks --all
          ./gradlew --console=plain :app:tasks --all

      - name: Run core tests
        run: |
          mkdir -p build/ep05
          python3 scripts/verify-extension-only-boundary.py > build/ep05/no-bypass-static.json
          ./gradlew --console=plain --stacktrace :private:release-core:test

      - name: Compile core domain
        run: ./gradlew --console=plain --stacktrace :core:domain:compileDebugKotlin

      - name: Run Robolectric data tests
        run: ./gradlew --console=plain --stacktrace :private:release-data:testDebugUnitTest

      - name: Run upstream current-list regression tests
        run: ./gradlew --continue --console=plain --stacktrace :core:model:testDebugUnitTest :core:ui:testDebugUnitTest :feature:home:testDebugUnitTest :feature:usermedialist:testDebugUnitTest

      - name: Run worker unit tests
        run: ./gradlew --continue --console=plain --stacktrace :feature:worker:testDebugUnitTest :feature:settings:testDebugUnitTest

      - name: Run app debug canary gating tests
        run: ./gradlew --console=plain --stacktrace :app:testFossDebugUnitTest

      - name: Test bounded shadow report parser
        run: |
          python3 -m py_compile scripts/aniworld-shadow-canary-report.py scripts/tests/test_aniworld_shadow_canary_report.py
          python3 -m unittest discover -s scripts/tests -p 'test_aniworld_shadow_canary_report.py' -v

      - name: Export Room schema 13 with KSP
        run: ./gradlew --console=plain --stacktrace :private:release-data:kspDebugKotlin

      - name: Validate generated Room schema 13
        id: schema
        shell: bash
        run: |
          mkdir -p private/release-data/schemas
          schema_path="$(find private/release-data/schemas -type f -name "13.json" -print -quit)"
          if [[ -z "$schema_path" ]]; then
            echo "Room schema 13.json was not generated"
            find private/release-data/schemas -type f -print
            exit 1
          fi
          python3 -m json.tool "$schema_path" >/dev/null
          echo "schema_path=$schema_path" >> "$GITHUB_OUTPUT"

      - name: Verify accepted Room schema 11 provenance
        run: |
          test "$(sha256sum private/release-data/schemas/com.axiel7.anihyou.release.data.db.ReleaseDatabase/11.json | cut -d ' ' -f 1)" = "$(cat .github/room-schema-11.sha256)"

      - name: Upload accepted Room schema 11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: room-schema-11
          path: private/release-data/schemas/com.axiel7.anihyou.release.data.db.ReleaseDatabase/11.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload genuine Room schema 13
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: room-schema-13
          path: ${{ steps.schema.outputs.schema_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload upstream and release regression reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-release-regression-reports
          path: |
            core/model/build/test-results/
            core/ui/build/test-results/
            feature/home/build/test-results/
            feature/usermedialist/build/test-results/
            feature/worker/build/test-results/
            feature/settings/build/test-results/
            app/build/test-results/
            private/release-core/build/test-results/
            private/release-data/build/test-results/
            build/ep05/no-bypass-static.json
          if-no-files-found: error
          retention-days: 14

  product-native-runtime:
    name: Pinned Wasmtime product native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Build accepted production native runtime
        run: bash tools/ep02-android/build-native.sh
      - name: Verify ELF, JNI exports and portable native checksums
        run: |
          git rev-parse HEAD > tools/ep02-android/results/native/source-commit.txt
          python3 .github/scripts/verify-extension-native-packaging.py \
            --write-checksums \
            --readelf "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --report tools/ep02-android/results/native/product-native-verification.json
      - name: Upload same-run product runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-extension-native-runtime
          path: tools/ep02-android/native-out/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native build and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-extension-native-build-evidence
          path: tools/ep02-android/results/native/
          if-no-files-found: warn
          retention-days: 14

  app-build:
    name: Foss compile, lint and APK
    needs: product-native-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install compile SDK 37
        run: |
          android sdk install --help
          android sdk install platforms/android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Stage same-run pinned native runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: product-extension-native-runtime
          path: tools/ep02-android/native-out

      - name: Verify staged native checksums
        run: python3 .github/scripts/verify-extension-native-packaging.py

      - name: Compile Foss debug
        run: ./gradlew --console=plain --stacktrace :app:compileFossDebugKotlin

      - name: Lint Foss debug
        run: ./gradlew --console=plain --stacktrace :app:lintFossDebug

      - name: Assemble Foss debug APK
        run: ./gradlew --console=plain --stacktrace :app:assembleFossDebug

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify source onboarding in the Foss debug app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            ./gradlew --console=plain --stacktrace :app:connectedFossDebugAndroidTest

      - name: Upload Foss Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foss-debug-android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble Foss release with R8
        run: ./gradlew --console=plain --stacktrace :app:assembleFossRelease

      - name: Verify packaged runtime in Debug and R8 release APKs
        run: |
          python3 .github/scripts/verify-extension-native-packaging.py \
            --apk-dir app/build/outputs/apk/foss/debug \
            --apk-dir app/build/outputs/apk/foss/release \
            --report tools/ep02-android/results/product-native/apk-native-verification.json

      - name: Upload product native packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-extension-apk-native-evidence
          path: tools/ep02-android/results/product-native/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Foss release APK and mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: anihyou-foss-release-apk
          path: |
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/mapping/fossRelease/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Foss debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: anihyou-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  migration-runtime:
    name: Android MigrationTestHelper runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - historical-room-schema-export
      - release-modules-test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install compile SDK 37
        run: |
          android sdk install --help
          android sdk install platforms/android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Download generated schemas 8, 9, 10, accepted 11/12 and generated 13
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: room-schema-*
          path: .ci-room-schemas
          merge-multiple: true

      - name: Prepare schema assets for MigrationTestHelper
        shell: bash
        run: |
          schema_dir="private/release-data/schemas/com.axiel7.anihyou.release.data.db.ReleaseDatabase"
          mkdir -p "$schema_dir"
          for version in 8 9 10 11 12 13; do
            schema_path="$(find .ci-room-schemas -type f -name "$version.json" -print -quit)"
            if [[ -z "$schema_path" ]]; then
              echo "Downloaded schema $version.json is missing"
              find .ci-room-schemas -type f -print
              exit 1
            fi
            python3 -m json.tool "$schema_path" >/dev/null
            cp "$schema_path" "$schema_dir/$version.json"
          done

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android MigrationTestHelper
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          script: bash .github/scripts/run-android-migration-tests.sh

      - name: Upload Android migration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-migration-test-reports
          path: |
            private/release-data/build/outputs/androidTest-results/connected
            private/release-data/build/reports/androidTests/connected
          if-no-files-found: warn
          retention-days: 14
