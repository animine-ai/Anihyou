
name: AniWorld Provider V3 Evidence Ingestion
# Manual browser trigger checkpoint; no product behavior changes.

on:
  push:
    branches:
      - feature/aniworld-provider-v3
    paths:
      - "private/release-core/**"
      - "private/release-data/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - "baselineprofile/**"
      - "wearos/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - ".github/workflows/aniworld-provider-v3.yml"

permissions:
  contents: read

concurrency:
  group: aniworld-provider-v3-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-room-schema-export:
    name: Export Room schema ${{ matrix.schema_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - schema_version: 8
            source_ref: 4c912fc5542060917f9ea7b1c289b22992d4017d
          - schema_version: 9
            source_ref: fba44c807f750469ee7b0571c418ffe3cacb67dd
    steps:
      - name: Checkout schema source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install compile SDK 37
        run: sdkmanager --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export Room schema
        run: ./gradlew --console=plain --stacktrace :private:release-data:compileDebugKotlin

      - name: Validate generated schema JSON
        id: schema
        shell: bash
        run: |
          mkdir -p private/release-data/schemas
          schema_path="$(find private/release-data/schemas -type f -name "${{ matrix.schema_version }}.json" -print -quit)"
          if [[ -z "$schema_path" ]]; then
            echo "Room schema ${{ matrix.schema_version }}.json was not generated"
            find private/release-data/schemas -type f -print
            exit 1
          fi
          python3 -m json.tool "$schema_path" >/dev/null
          echo "schema_path=$schema_path" >> "$GITHUB_OUTPUT"

      - name: Upload real schema ${{ matrix.schema_version }}
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-${{ matrix.schema_version }}
          path: ${{ steps.schema.outputs.schema_path }}
          if-no-files-found: error
          retention-days: 14

  release-modules-test:
    name: Core/Data tests and Room schema 10 export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install compile SDK 37
        run: sdkmanager --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify projects and required task graph
        run: |
          ./gradlew --console=plain projects
          ./gradlew --console=plain :private:release-core:tasks --all
          ./gradlew --console=plain :private:release-data:tasks --all
          ./gradlew --console=plain :app:tasks --all

      - name: Run core and Robolectric data tests
        run: ./gradlew --console=plain --stacktrace :private:release-core:test :private:release-data:testDebugUnitTest

      - name: Validate generated Room schema 10
        id: schema
        shell: bash
        run: |
          mkdir -p private/release-data/schemas
          schema_path="$(find private/release-data/schemas -type f -name "10.json" -print -quit)"
          if [[ -z "$schema_path" ]]; then
            echo "Room schema 10.json was not generated"
            find private/release-data/schemas -type f -print
            exit 1
          fi
          python3 -m json.tool "$schema_path" >/dev/null
          echo "schema_path=$schema_path" >> "$GITHUB_OUTPUT"

      - name: Upload real schema 10
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-10
          path: ${{ steps.schema.outputs.schema_path }}
          if-no-files-found: error
          retention-days: 14

  app-build:
    name: Foss compile, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: release-modules-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install compile SDK 37
        run: sdkmanager --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Foss debug
        run: ./gradlew --console=plain --stacktrace :app:compileFossDebugKotlin

      - name: Lint Foss debug
        run: ./gradlew --console=plain --stacktrace :app:lintFossDebug

      - name: Assemble Foss debug APK
        run: ./gradlew --console=plain --stacktrace :app:assembleFossDebug

      - name: Upload Foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anihyou-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  migration-runtime:
    name: Android MigrationTestHelper runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - historical-room-schema-export
      - release-modules-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install compile SDK 37
        run: sdkmanager --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download generated schemas 8, 9 and 10
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: room-schema-*
          path: .ci-room-schemas
          merge-multiple: true

      - name: Prepare schema assets for MigrationTestHelper
        shell: bash
        run: |
          schema_dir="private/release-data/schemas/com.axiel7.anihyou.release.data.db.ReleaseDatabase"
          mkdir -p "$schema_dir"
          for version in 8 9 10; do
            schema_path="$(find .ci-room-schemas -type f -name "$version.json" -print -quit)"
            if [[ -z "$schema_path" ]]; then
              echo "Downloaded schema $version.json is missing"
              find .ci-room-schemas -type f -print
              exit 1
            fi
            python3 -m json.tool "$schema_path" >/dev/null
            cp "$schema_path" "$schema_dir/$version.json"
          done

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android MigrationTestHelper
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          script: ./gradlew --console=plain --stacktrace :private:release-data:connectedDebugAndroidTest
