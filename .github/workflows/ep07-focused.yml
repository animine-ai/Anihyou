name: EP07 focused installer and Foss repair gate

on:
  push:
    branches:
      - ep07/update-ux-recovery
      - ep07/extension-update-ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep07-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Installer and repository tests
            tasks: ':private:release-core:test :private:release-data:testDebugUnitTest'
          - check: Foss and settings compile
            tasks: ':app:compileFossDebugKotlin :app:compileFossDebugAndroidTestKotlin :feature:settings:testDebugUnitTest :feature:worker:testDebugUnitTest :feature:calendar:testDebugUnitTest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK 37
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run focused checks
        run: ./gradlew --continue --console=plain --stacktrace ${{ matrix.tasks }}
      - name: Upload focused reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ep07-focused-${{ strategy.job-index }}
          path: |
            private/release-core/build/reports/tests/**
            private/release-core/build/test-results/**
            private/release-data/build/reports/tests/**
            private/release-data/build/test-results/**
            feature/settings/build/reports/tests/**
            feature/settings/build/test-results/**
            feature/worker/build/test-results/**
            feature/calendar/build/test-results/**
          if-no-files-found: warn
