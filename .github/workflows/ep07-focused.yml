name: EP07 focused installer and Foss repair gate

on:
  push:
    branches:
      - ep07/update-ux-recovery
      - ep07/extension-update-ux
      - ep07/device-feedback-cutover
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep07-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Installer and repository tests
            tasks: ':private:release-core:test :private:release-data:testDebugUnitTest'
          - check: Foss and settings compile
            tasks: ':app:compileFossDebugKotlin :app:compileFossDebugAndroidTestKotlin :feature:settings:testDebugUnitTest :feature:worker:testDebugUnitTest :feature:calendar:testDebugUnitTest :feature:widget:testDebugUnitTest :feature:mediadetails:testDebugUnitTest :feature:home:testDebugUnitTest :feature:usermedialist:testDebugUnitTest :core:ui:testDebugUnitTest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK 37
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run focused checks
        shell: bash
        run: ./gradlew --continue --console=plain ${{ matrix.tasks }} 2>&1 | tee gradle-focused.log
      - name: Test counts and measurements
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = {}
          measure = []
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              module = path.split('/build/')[0]
              row = totals.setdefault(module, [0, 0, 0, 0])
              row[0] += int(root.get('tests', 0)); row[1] += int(root.get('failures', 0))
              row[2] += int(root.get('errors', 0)); row[3] += int(root.get('skipped', 0))
              for out in root.iter('system-out'):
                  measure += [line for line in (out.text or '').splitlines() if line.startswith('MEASURE ')]
          print('=== TEST COUNTS BEGIN (module tests failures errors skipped) ===')
          for module, row in sorted(totals.items()):
              print(module, *row)
          print('total', *[sum(r[i] for r in totals.values()) for i in range(4)])
          print('=== TEST COUNTS END ===')
          for line in measure:
              print(line)
          PY
      - name: Failure digest
        if: failure()
        shell: bash
        run: |
          echo "=== DIGEST BEGIN ==="
          grep -E '^e: |> Task .* FAILED' gradle-focused.log | cut -c1-340 | sort -u | head -40 || true
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          failed = 0
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for element in case.findall(kind):
                          failed += 1
                          if failed <= 25:
                              name = case.get('classname', '').split('.')[-1] + '.' + case.get('name', '')
                              print('TEST', name, '|', (element.get('message') or '').replace('\n', ' ')[:260])
          print('failed tests:', failed)
          PY
          echo "=== DIGEST END ==="
      - name: Upload focused reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ep07-focused-${{ strategy.job-index }}
          path: |
            private/release-core/build/reports/tests/**
            private/release-core/build/test-results/**
            private/release-data/build/reports/tests/**
            private/release-data/build/test-results/**
            feature/settings/build/reports/tests/**
            feature/settings/build/test-results/**
            feature/worker/build/test-results/**
            feature/calendar/build/test-results/**
            feature/widget/build/reports/tests/**
            feature/widget/build/test-results/**
            feature/home/build/test-results/**
            feature/usermedialist/build/test-results/**
            core/ui/build/test-results/**
          if-no-files-found: warn
