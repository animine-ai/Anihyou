name: EP01 Android WASM Runtime
on:
  push:
    branches: [feature/aniworld-provider-v3, ep04/aniworld-v1, ep06/provider-navigation-watch-next]
    paths: ["gradle/**", "app/**", "core/**", "feature/**", "tools/ep01-android/**", "tools/ep02-android/**", "private/release-core/**", "private/release-data/**", ".github/workflows/ep01-android-runtime.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep01-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-contract:
    name: Extension ABI strict codec tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install project compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run strict contract and compatibility tests
        run: ./gradlew --console=plain :private:release-core:test :private:release-data:testDebugUnitTest
      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep02-host-contract-tests
          path: |
            private/release-core/build/reports/tests/
            private/release-data/build/reports/tests/
          if-no-files-found: warn
  native:
    name: Wasmtime 37.0.0 Android API 24 native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Build pinned Android native runtime
        run: bash tools/ep01-android/build-native.sh
      - name: Upload native runtime and dependency lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep01-native-x86_64
          path: tools/ep01-android/native-out/
          if-no-files-found: error
      - name: Require committed dependency lock before Android matrix
        run: git ls-files --error-unmatch tools/ep01-android/native/Cargo.lock
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep01-native-evidence
          path: tools/ep01-android/results/native/
          if-no-files-found: warn
  android:
    needs: [native, host-contract]
    name: Android API ${{ matrix.api }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {api: 24, variant: debug}
          - {api: 24, variant: release}
          - {api: 35, variant: debug}
          - {api: 35, variant: release}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install project compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ep01-native-x86_64
          path: tools/ep01-android/native-out
      - name: Verify Rust fixture and build standalone Android probe
        shell: bash
        run: |
          mkdir -p tools/ep01-android/results
          git rev-parse HEAD > tools/ep01-android/results/source-commit.txt
          mkdir -p tools/ep01-android/app/src/main/jniLibs/x86_64
          cp tools/ep01-android/native-out/libep01_runtime.so tools/ep01-android/app/src/main/jniLibs/x86_64/
          cp tools/ep01-android/native-out/Cargo.lock tools/ep01-android/results/
          python3 tools/ep01-android/prepare_assets.py
          ./gradlew -p tools/ep01-android --console=plain --stacktrace :app:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }} 2>&1 | tee tools/ep01-android/results/build.txt
          sha256sum tools/ep01-android/app/build/outputs/apk/${{ matrix.variant }}/*.apk > tools/ep01-android/results/apk.sha256
          git rev-parse HEAD > tools/ep01-android/results/source-commit.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute isolated runtime assertions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash tools/ep01-android/run-device.sh ${{ matrix.variant }} ${{ matrix.api }}
      - name: Collect device diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p tools/ep01-android/results
          timeout 15 adb logcat -d > tools/ep01-android/results/cleanup-logcat.txt 2>&1 || true
      - name: Upload APK and exact execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep01-api-${{ matrix.api }}-${{ matrix.variant }}
          path: |
            tools/ep01-android/app/build/outputs/apk/
            tools/ep01-android/app/build/outputs/mapping/
            tools/ep01-android/results/
          if-no-files-found: error
          retention-days: 14
