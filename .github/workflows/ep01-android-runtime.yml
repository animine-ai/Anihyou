name: EP01 Android WASM Runtime
on:
  push:
    branches: [feature/aniworld-provider-v3]
    paths: ["tools/ep01-android/**", ".github/workflows/ep01-android-runtime.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep01-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android API ${{ matrix.api }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {api: 24, variant: debug}
          - {api: 24, variant: release}
          - {api: 28, variant: debug}
          - {api: 35, variant: debug}
          - {api: 37, variant: release}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install project compile SDK
        run: android sdk install platforms/android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify Rust fixture and build standalone Android probe
        shell: bash
        run: |
          python3 tools/ep01-android/prepare_assets.py
          ./gradlew -p tools/ep01-android --console=plain --stacktrace :app:assemble${{ matrix.variant == 'release' && 'Release' || 'Debug' }}
          mkdir -p tools/ep01-android/results
          sha256sum tools/ep01-android/app/build/outputs/apk/${{ matrix.variant }}/*.apk > tools/ep01-android/results/apk.sha256
          git rev-parse HEAD > tools/ep01-android/results/source-commit.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute isolated runtime assertions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash tools/ep01-android/run-device.sh ${{ matrix.variant }}
      - name: Collect device diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p tools/ep01-android/results
          timeout 15 adb logcat -d > tools/ep01-android/results/logcat.txt 2>&1 || true
      - name: Upload APK and exact execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ep01-api-${{ matrix.api }}-${{ matrix.variant }}
          path: |
            tools/ep01-android/app/build/outputs/apk/
            tools/ep01-android/app/build/outputs/mapping/
            tools/ep01-android/results/
          if-no-files-found: error
          retention-days: 14

