name: EP06 UI failure artifact diagnosis
on:
  push:
    branches: [ep06/ui-failure-diagnostics]
    paths: [.github/workflows/ep06-ui-artifact-diagnosis.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing Foss UI failure XML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, urllib.request, urllib.error, zipfile, xml.etree.ElementTree as ET
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          url = "https://api.github.com/repos/animine-ai/Anihyou/actions/artifacts/11194859782/zip"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              data = response.read()
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              location = error.headers["Location"]
              data = urllib.request.urlopen(location, timeout=30).read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for path in archive.namelist():
                  if not path.endswith(".xml"):
                      continue
                  root = ET.fromstring(archive.read(path))
                  print("SUITE", path, root.attrib)
                  for case in root.iter("testcase"):
                      failures = list(case.findall("failure")) + list(case.findall("error"))
                      if not failures:
                          print("PASS", case.attrib.get("classname"), case.attrib.get("name"))
                      for failure in failures:
                          print("FAIL", case.attrib.get("classname"), case.attrib.get("name"))
                          print(failure.attrib)
                          print((failure.text or "")[:24000])
          PY
