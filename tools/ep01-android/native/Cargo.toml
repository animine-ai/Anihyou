[package]
name = "ep01-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ep01_runtime"
crate-type = ["cdylib"]

[dependencies]
anyhow = "=1.0.100"
jni = { version = "=0.21.1", default-features = false }
serde_json = "=1.0.145"
wasmtime = { version = "=37.0.0", default-features = false, features = ["runtime", "cranelift", "std"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "debuginfo"
